name: 缺陷报告（Bug report）
description: 引擎给出错误诊断、崩溃，或该诚实拦截却没拦截
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈！本仓库纪律：**先查不许猜**。请尽量给出可复现的最小输入——
        引擎的输出都是「给定输入 → 结构化诊断」，有了输入我们就能复现。
        注意：**不要在公开 issue 里贴敏感信息**（本机路径、邮箱、密钥、私有项目名）。
        安全类问题请走仓库页 Security → Report a vulnerability。
  - type: textarea
    id: input
    attributes:
      label: 你的输入
      description: 中文原文；若是 CLI，附完整命令（用了结构化线索就贴 --structured 的 JSON）
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期望 vs 实际
      description: 期望什么（判类/路由/某构件结论/应诚实拦截），实际得到什么
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: 实际输出
      description: 粘贴 --json 或报告的相关片段（去掉敏感内容）
      render: text
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: 环境
      description: 操作系统 + Python 版本；若为安装使用，附 pip show paradox-engine 输出
    validations:
      required: false
  - type: checkboxes
    id: checks
    attributes:
      label: 自查
      options:
        - label: 我已运行 python run_tests.py，确认不是本地环境问题
          required: false
        - label: 我确认报告里不含敏感信息（路径/邮箱/密钥/私有项目名）
          required: true